name: Build Aman-Sarthi
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: |
          npm install --legacy-peer-deps || npm install --force
          npm install @expo/cli --save-dev || true

      - name: Build Web
        run: |
          mkdir -p dist
          npx expo export --platform web --output-dir dist || echo "web build skipped"
        continue-on-error: true

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: aman-sarthi-web
          path: dist
          if-no-files-found: warn
