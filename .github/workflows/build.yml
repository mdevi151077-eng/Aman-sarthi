name: Build Aman-Sarthi App & Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: npm ci

      - run: npx expo export --platform web --output-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: aman-sarthi-web
          path: dist

      - run: npm install -g eas-cli

      - run: eas build --platform android --local --output ./app.apk --non-interactive || npx expo prebuild && cd android && ./gradlew assembleRelease && cp app/build/outputs/apk/release/app-release.apk ../app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aman-sarthi-apk
          path: app.apk
