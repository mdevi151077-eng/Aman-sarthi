name: Build Aman-Sarthi
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps || npm install --force || echo "install done"
      - run: ls -la
      - run: cat package.json || echo "no package"
