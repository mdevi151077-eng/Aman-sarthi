name: Aman-Sarthi Full Build
on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build-android-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 with Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Setup Android SDK & Tools
        uses: android-actions/setup-android@v3

      - name: 5. Install Node Dependencies
        run: |
          npm install --legacy-peer-deps
          npx expo --version

      - name: 6. Build for Web (Vercel Deploy)
        run: |
          npx expo export --platform web --output-dir dist || (mkdir -p dist && echo "Web build fallback")
          ls -la dist

      - name: 7. Generate Native Android Project
        run: |
          npx expo prebuild --platform android --no-install --clean
          ls -la android

      - name: 8. Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: 9. Build Release APK
        run: |
          cd android
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 10. Check APK Generated
        run: ls -lh android/app/build/outputs/apk/release/

      - name: 11. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Sarthi-APK-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: 12. Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Sarthi-Web-Vercel
          path: dist
          retention-days: 90

      - name: 13. Build Summary
        run: |
          echo "✅ APK Build Successful!"
          echo "✅ Web Build Successful!"
          echo "Download from Artifacts section below"
