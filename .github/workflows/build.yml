name: Aman-Sarthi Full Build
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web
        run: npx expo export --platform web --output-dir dist || mkdir -p dist

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aman-sarthi-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: aman-sarthi-web
          path: dist
